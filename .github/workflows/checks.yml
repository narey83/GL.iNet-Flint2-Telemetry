name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-cjson shellcheck
      - run: node tests/luci.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m py_compile scripts/*.py tests/test_*.py
      - name: Lua contracts
        env:
          LUA_PATH: ./package/files/usr/lib/lua/?.lua;;
        run: |
          lua5.1 tests/core.lua
          lua5.1 tests/metrics.lua
          lua5.1 tests/sources.lua
          lua5.1 tests/standards.lua
      - run: shellcheck -s dash -x package/files/etc/init.d/flint2 package/files/usr/libexec/flint2/firewall-events package/postinst package/prerm tests/*.sh
      - run: shellcheck scripts/build-capture.sh
